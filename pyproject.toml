[project]
name = "wuptracker"
version = "0.1.0"
description = "Captura screenshots de uma sessão de trabalho e gera writeups com IA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Ratto" }]
keywords = ["writeup", "pentest", "ctf", "screenshot", "llm", "ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pynput>=1.7",
    "Pillow>=10",
    "mss>=9",
    "python-dotenv>=1.0",
    "plyer>=2.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/rattinho/wuptracker"
Repository = "https://github.com/rattinho/wuptracker"

[project.scripts]
wuptracker = "wuptracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wuptracker"]
